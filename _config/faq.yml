titulo: "❓ Preguntas Frecuentes"
subtitulo: "Aquí respondemos las consultas más comunes sobre nuestra comunidad educativa."
preguntas:
  - pregunta: "🌱 ¿Qué es la educación Waldorf?"
    respuesta: "La pedagogía Waldorf acompaña el desarrollo integral del niño —mente, corazón y manos— a través de experiencias vivenciales, arte, naturaleza y comunidad. No solo enseñamos contenidos: cultivamos curiosidad, creatividad y voluntad."
  - pregunta: "👩‍🏫 ¿Cuántos estudiantes hay por curso?"
    respuesta: "Funcionamos con un máximo de 16 niñas y niños por curso. Este tamaño permite un acompañamiento personalizado y una relación cercana entre estudiantes, docentes y familias."
  - pregunta: "📝 ¿Cómo es la evaluación?"
    respuesta: "La evaluación es cualitativa y continua, basada en informes narrativos y portafolios. Observamos el desarrollo integral del niño: su pensamiento, sentimientos, voluntad y habilidades sociales. No usamos notas ni calificaciones, sino retroalimentación detallada que acompaña el proceso de aprendizaje."
  - pregunta: "📝 ¿Qué significa que nuestro establecimiento no tenga reconocimiento oficial del Mineduc?"
    respuesta: "Significa que, la normativa chilena establece que los estudiantes de colegios sin reconocimiento deben rendir **Exámenes Libres de Validación de Estudios** en establecimientos designados por el Mineduc. Al aprobar, reciben sus certificados oficiales de curso o nivel, equivalentes a los de cualquier colegio reconocido. Es responsabilidad de cada familia realizar la inscripción de manera **online** o presencial en el **Departamento Provincial de Educación** por parte del padre/madre/tutor.\n\n👉 Más información oficial en el sitio del Ministerio de Educación de Chile: [Exámenes de Validación de Estudios – Ayuda Mineduc](https://www.ayudamineduc.cl/ficha/examenes-libres-menores-de-18-anos-11)"
  - pregunta: "📊 ¿Cómo les va a los alumnos Waldorf en los exámenes libres del MINEDUC?"
    respuesta: "Los estudiantes Waldorf en Chile suelen obtener **calificaciones de buenas a muy buenas** en los exámenes libres del Ministerio de Educación. La gran mayoría alcanza promedios superiores al aprobado, y cerca del **90% obtiene notas entre 5,0 y 7,0**, lo que corresponde a un desempeño bueno o sobresaliente según la escala chilena.\n\n- Las **reprobaciones son prácticamente inexistentes** en este grupo.\n- El rendimiento suele ser **igual o mejor** que el de estudiantes de otras modalidades alternativas.\n- Los alumnos logran certificar sus estudios básicos y medios sin dificultades.\n\nAunque la pedagogía Waldorf no se basa en pruebas tradicionales, los estudiantes cuentan con **herramientas sólidas de aprendizaje** que les permiten enfrentar con éxito las evaluaciones del Estado.\n\n👉 Puedes leer más en estas fuentes:\n[Estudio sobre educación alternativa (Scielo)](http://www.scielo.org.pe/scielo.php?script=sci_arttext&pid=S1019-94032017000100001) | [Ciencia Latina](https://ciencialatina.org/index.php/cienciala/article/view/6298) | [CIPER Chile](https://www.ciperchile.cl/2021/10/08/la-educacion-alternativa-como-un-derecho/) | [Trinus - Rendimiento Waldorf](https://trinus.org/el-rendimiento-academico-de-los-alumnos-waldorf-segun-pisa-y-otros-estudios/) | [La Tercera - Generación Waldorf](https://www.latercera.com/noticia/generacion-waldorf/)"
  - pregunta: "🎨 ¿Hay talleres extracurriculares?"
    respuesta: "Sí, ofrecemos experiencias en carpintería, arte y manualidades, cocina, música, cuentos, huerta, euritmia y movimiento. Estas actividades están integradas en la jornada escolar, entendiendo que el aprendizaje se vive con todo el ser."
  - pregunta: "🚍 ¿Hay transporte o alimentación disponible?"
    respuesta: "Actualmente no ofrecemos transporte ni alimentación. Valoramos que las familias puedan acompañar a sus hijos al inicio y término del día. En cuanto a la alimentación, los niños traen su propio almuerzo, y promovemos hábitos saludables y conciencia sobre los alimentos."
  - pregunta: "🏡 ¿Puedo visitar el colegio antes de postular?"
    respuesta: "¡Por supuesto! Creemos que la mejor manera de conocer Trekan es viviendo una mañana en nuestra comunidad. Escríbenos por WhatsApp para agendar tu visita."
  - pregunta: "📅 ¿Cuándo puedo postular?"
    respuesta: "El proceso de admisión está abierto todo el año, siempre que haya cupos disponibles. Te recomendamos postular con anticipación para asegurar tu lugar."
  - pregunta: "💌 ¿Cómo me contacto rápidamente?"
    respuesta: "Puedes escribirnos directamente a través del botón de WhatsApp que ves en pantalla o usar el formulario \"Postula aquí\" para que podamos enviarte toda la información."
