titulo: "Donde el niño camina con voluntad"
subtitulo: "En el corazón de **Puerto Varas**, nace **Trekan**, una comunidad educativa inspirada en la **pedagogía Waldorf** que acompaña a niñas y niños **de 3 a 14 años** en su desarrollo integral.\n\n**Trekan** significa *caminante* en mapudungun: un ser que decide encaminarse hacia el mundo… y hacia sí mismo."
cta_text: "🌿 Conocer el proceso de admisión"
