titulo: "Enfoque Pedagógico Waldorf"
descripcion: "Inspirados en Rudolf Steiner, entendemos al niño como un ser espiritual en evolución. Nuestra educación armoniza el **pensamiento, el sentir y la voluntad** a través del arte, el ritmo y el movimiento."
pilares:
  - titulo: "🌱 Aprendizaje Vivencial"
    descripcion: "Matemáticas, lenguaje e historia se viven con las manos, el corazón y la mente."
  - titulo: "👨‍🏫 Maestro Guía"
    descripcion: "Acompaña al niño durante varios años, creando un vínculo profundo y seguro."
  - titulo: "🌿 Conexión con la Naturaleza"
    descripcion: "Huerta, carpintería, salidas al bosque y celebración de las estaciones."
  - titulo: "📚 Bloques Temáticos"
    descripcion: "Contenidos integrados: arte, música, manualidades y movimiento."
