  <!-- Cookie Consent CSS -->
  <style>
    #cookie-banner {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #1a2e25;
      color: #e8f5e8;
      padding: 1rem 1.5rem;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.25);
      transform: translateY(100%);
      transition: transform 0.4s ease;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    #cookie-banner.visible { transform: translateY(0); }
    #cookie-banner p { margin: 0; flex: 1; min-width: 220px; opacity: 0.9; }
    #cookie-banner a { color: #A8D8B9; text-decoration: underline; }
    .cookie-actions { display: flex; gap: 0.6rem; flex-shrink: 0; }
    .cookie-btn {
      padding: 0.55rem 1.2rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .cookie-btn:active { transform: scale(0.97); }
    .cookie-accept { background: #2E5E4E; color: white; }
    .cookie-accept:hover { background: #A8D8B9; color: #1a2e25; }
    .cookie-reject { background: transparent; color: #A8D8B9; border: 1px solid #A8D8B9; }
    .cookie-reject:hover { background: rgba(168,216,185,0.1); }
    @media (max-width: 480px) {
      #cookie-banner { padding: 1rem; }
      .cookie-actions { width: 100%; }
      .cookie-btn { flex: 1; text-align: center; }
    }
  </style>
