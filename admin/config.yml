# ═══════════════════════════════════════════════════
# DECAP CMS — Colegio Waldorf Trekan
# Panel en: colegiowaldorftrekan.cl/admin
# ═══════════════════════════════════════════════════

backend:
  name: git-gateway
  branch: main

# Subida de imágenes
media_folder: "images"
public_folder: "images"

# Idioma español
locale: 'es'

# ═══════════════════════════════════════════════════
# COLECCIONES — qué puede editar el equipo
# ═══════════════════════════════════════════════════
collections:

  # ── NOTICIAS ──────────────────────────────────────
  - name: "noticias"
    label: "📰 Noticias"
    label_singular: "Noticia"
    folder: "_noticias"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{titulo}} — {{fecha}}"
    fields:
      - label: "Título"
        name: "titulo"
        widget: "string"
        hint: "Ej: Fiesta de la Luz 2026"

      - label: "Fecha"
        name: "fecha"
        widget: "string"
        hint: "Ej: 21 de junio de 2026"

      - label: "Foto principal"
        name: "foto"
        widget: "image"
        hint: "JPG recomendado, máximo 500KB"

      - label: "Descripción de la foto (para accesibilidad)"
        name: "foto_alt"
        widget: "string"
        hint: "Ej: Niños celebrando la fiesta de la luz"

      - label: "Texto de la noticia"
        name: "texto"
        widget: "markdown"

      - label: "ID Video YouTube (opcional)"
        name: "video_id"
        widget: "string"
        required: false
        hint: "Solo el ID, ej: eOsbR_QoNAY (de youtube.com/watch?v=eOsbR_QoNAY)"

      - label: "Fotos adicionales (galería opcional)"
        name: "galeria"
        widget: "list"
        required: false
        field:
          label: "Foto"
          name: "foto"
          widget: "image"

  # ── ACTIVIDADES ───────────────────────────────────
  - name: "actividades"
    label: "📅 Actividades"
    label_singular: "Actividad"
    folder: "_actividades"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{nombre}} — {{dia}} {{mes}}"
    fields:
      - label: "Nombre del evento"
        name: "nombre"
        widget: "string"
        hint: "Ej: Asamblea de Familias"

      - label: "Día"
        name: "dia"
        widget: "string"
        hint: "Ej: 28"

      - label: "Mes"
        name: "mes"
        widget: "select"
        options:
          - { label: "Enero",      value: "ENE" }
          - { label: "Febrero",    value: "FEB" }
          - { label: "Marzo",      value: "MAR" }
          - { label: "Abril",      value: "ABR" }
          - { label: "Mayo",       value: "MAY" }
          - { label: "Junio",      value: "JUN" }
          - { label: "Julio",      value: "JUL" }
          - { label: "Agosto",     value: "AGO" }
          - { label: "Septiembre", value: "SEP" }
          - { label: "Octubre",    value: "OCT" }
          - { label: "Noviembre",  value: "NOV" }
          - { label: "Diciembre",  value: "DIC" }

      - label: "Tipo de evento"
        name: "tipo"
        widget: "select"
        options:
          - { label: "🔵 Asamblea",    value: "asamblea" }
          - { label: "🟢 Celebración", value: "celebracion" }
          - { label: "🟠 Admisión",    value: "admision" }
          - { label: "🟣 Taller",      value: "taller" }

      - label: "Descripción"
        name: "descripcion"
        widget: "text"

      - label: "Hora y lugar"
        name: "hora"
        widget: "string"
        hint: "Ej: Las Azaleas 96 · 18:30 hrs"

  # ── CONFIGURACIÓN GENERAL ─────────────────────────
  - name: "configuracion"
    label: "⚙️ Información del Colegio"
    files:
      - label: "Datos de contacto"
        name: "contacto"
        file: "_config/contacto.yml"
        fields:
          - { label: "Teléfono", name: "telefono", widget: "string", hint: "Ej: +56 9 6776 5106" }
          - { label: "Email admisión", name: "email_admision", widget: "string" }
          - { label: "Email coordinación", name: "email_coordinacion", widget: "string" }
          - { label: "Dirección", name: "direccion", widget: "string" }
          - { label: "Link Google Form postulación", name: "link_postulacion", widget: "string" }
          - { label: "Instagram handle", name: "instagram", widget: "string", hint: "Sin @, ej: waldorftrekanpv" }
