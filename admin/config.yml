backend:
  name: github
  repo: haramaradripindoor-stack/Webwaldorfv2
  branch: main

site_url: "https://www.colegiowaldorftrekan.cl"
display_url: "https://www.colegiowaldorftrekan.cl"
logo_url: "https://www.colegiowaldorftrekan.cl/assets/logo.png"

media_folder: "images"
public_folder: "/images"

locale: 'es'

collections:
  - name: "noticias"
    label: "Noticias"
    folder: "_noticias"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{titulo}}"
    fields:
      - {label: "Título", name: "titulo", widget: "string", hint: "Ej: Celebración de la Fiesta de la Primavera"}
      - {label: "Fecha", name: "fecha", widget: "string", hint: "Ej: 21 de septiembre de 2026"}
      - {label: "Foto principal (encabezado)", name: "foto", widget: "image", hint: "Formato recomendado: JPG o PNG. Tamaño: 800x600px"}
      - {label: "Descripción foto (Accesibilidad)", name: "foto_alt", widget: "string", required: false, hint: "Breve descripción para personas con discapacidad visual."}
      - label: "Texto de la noticia"
        name: "body"
        widget: "markdown"
        hint: "Escribe el contenido principal aquí."
        buttons: ["bold", "italic", "link", "heading-two", "heading-three", "bulleted-list", "numbered-list"]
        editor_components: ["image", "code-block"]
      - {label: "ID Video YouTube (opcional)", name: "video_id", widget: "string", required: false, hint: "Ej: eOsbR_QoNAY (solo el ID, no el enlace completo)"}
      - label: "Galería de fotos adicionales"
        name: "galeria"
        widget: "list"
        required: false
        hint: "Agrega fotos extra que aparecerán al final de la noticia."
        field: {label: "Foto", name: "foto", widget: "image"}

  - name: "actividades"
    label: "Calendario (Actividades)"
    folder: "_actividades"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{nombre}}"
    fields:
      - {label: "Nombre del evento", name: "nombre", widget: "string", hint: "Ej: Escuela para Padres"}
      - label: "Día"
        name: "dia"
        widget: "string"
        hint: "Ej: 28 (solo números o rangos como 14-18)"
        pattern: ['^[0-9A-Za-z \-\.]+$', "Introduce un día válido (ej: 28 o 14-18)"]
      - label: "Mes"
        name: "mes"
        widget: "select"
        options: ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"]
      - label: "Tipo / Categoría"
        name: "tipo"
        widget: "select"
        options:
          - {label: "🔵 Asamblea", value: "asamblea"}
          - {label: "🟢 Celebración", value: "celebracion"}
          - {label: "🟠 Admisión / Charlas", value: "admision"}
          - {label: "🟣 Taller / Cursos", value: "taller"}
          - {label: "⚪ Reunión", value: "reunion"}
          - {label: "🟡 Charla", value: "charla"}
      - {label: "Descripción corta (Tarjeta)", name: "descripcion", widget: "text", required: false, hint: "Resumen breve que aparece en la cajita del calendario."}
      - {label: "Hora y lugar (opcional)", name: "hora", widget: "string", required: false, hint: "Ej: Las Azaleas 96 · 18:30 hrs"}
      - label: "Contenido completo (Detalle)"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Texto largo, detalles o instrucciones adicionales para las familias."
        buttons: ["bold", "italic", "link", "bulleted-list"]
        editor_components: []

  - name: "ajustes"
    label: "Ajustes Globales"
    files:
      - label: "Datos de Contacto"
        name: "contacto"
        file: "_config/contacto.yml"
        fields:
          - {label: "Teléfono Principal", name: "telefono", widget: "string", hint: "Ej: +56 9 6776 5106"}
          - {label: "Email Admisión", name: "email_admision", widget: "string"}
          - {label: "Email Coordinación", name: "email_coordinacion", widget: "string"}
          - {label: "Dirección", name: "direccion", widget: "string"}
          - {label: "Link Formulario de Postulación", name: "link_postulacion", widget: "string"}
          - {label: "Usuario de Instagram", name: "instagram", widget: "string", hint: "Ej: waldorftrekanpv"}

  - name: "paginas"
    label: "Páginas de la Web"
    files:
      - label: "Inicio (Hero)"
        name: "inicio"
        file: "_config/inicio.yml"
        fields:
          - {label: "Título Principal", name: "titulo", widget: "string"}
          - {label: "Subtítulo", name: "subtitulo", widget: "string"}
          - {label: "Texto Botón Principal", name: "cta_text", widget: "string"}
          
      - label: "Quiénes Somos"
        name: "quienes_somos"
        file: "_config/quienes_somos.yml"
        fields:
          - {label: "Título", name: "titulo", widget: "string"}
          - label: "Tarjetas (Misión, Visión, etc.)"
            name: "tarjetas"
            widget: "list"
            fields:
              - {label: "Título (con emoji)", name: "titulo", widget: "string"}
              - {label: "Texto", name: "texto", widget: "markdown", buttons: ["bold", "italic", "link"]}
              - {label: "Imagen (Opcional)", name: "imagen", widget: "image", required: false}
              - {label: "Ocupar todo el ancho", name: "full_width", widget: "boolean", default: false, required: false}
          
      - label: "Pedagogía"
        name: "pedagogia"
        file: "_config/pedagogia.yml"
        fields:
          - {label: "Título de Sección", name: "titulo", widget: "string"}
          - {label: "Descripción Principal", name: "descripcion", widget: "text"}
          - label: "Pilares / Viñetas"
            name: "pilares"
            widget: "list"
            fields:
              - {label: "Título del Pilar", name: "titulo", widget: "string"}
              - {label: "Descripción", name: "descripcion", widget: "text"}
              - {label: "Imagen (Opcional)", name: "imagen", widget: "image", required: false}

      - label: "Preguntas Frecuentes (FAQ)"
        name: "faq"
        file: "_config/faq.yml"
        fields:
          - {label: "Título Principal", name: "titulo", widget: "string"}
          - {label: "Subtítulo", name: "subtitulo", widget: "string"}
          - label: "Preguntas y Respuestas"
            name: "preguntas"
            widget: "list"
            fields:
              - {label: "Pregunta", name: "pregunta", widget: "string"}
              - {label: "Respuesta", name: "respuesta", widget: "markdown"}
