<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <title>Trekan - Monograma T de Cobijo (Favicon e Isotipo Minimalista)</title>
  <defs>
    <style>
      .t-fuste {
        fill: none;
        stroke: #2D2A4F;
        stroke-width: 44;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .t-techo {
        fill: none;
        stroke: #2D2A4F;
        stroke-width: 44;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .t-semilla {
        fill: #D49A2A;
      }
    </style>
  </defs>

  <!-- Techo / Cobijo Curvo que acoge -->
  <path class="t-techo" d="M 120 185 C 160 140, 210 120, 256 120 C 302 120, 352 140, 392 185" />
  
  <!-- Fuste vertical firme -->
  <line class="t-fuste" x1="256" y1="124" x2="256" y2="390" />
  
  <!-- Semilla / Punto Miel de Infancia -->
  <circle class="t-semilla" cx="355" cy="365" r="30" />
</svg>
