<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="100%">
  <title>Colegio Waldorf Trekan - Logotipo Horizontal (Fondo Oscuro / Maqui)</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Figtree:wght@500;600&amp;display=swap');
      .iso-camino-luz {
        fill: none;
        stroke: #F4EEE3;
        stroke-width: 14;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .iso-nino-luz {
        fill: #D49A2A;
      }
      .texto-nombre-luz {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 500;
        font-size: 88px;
        fill: #F4EEE3;
        letter-spacing: -1.5px;
      }
      .texto-sub-luz {
        font-family: 'Figtree', system-ui, sans-serif;
        font-weight: 600;
        font-size: 19px;
        fill: #D49A2A;
        letter-spacing: 9px;
      }
    </style>
  </defs>

  <!-- Grupo Isotipo en Lana y Miel -->
  <g transform="translate(40, 20) scale(0.75)">
    <!-- Niño centro -->
    <circle class="iso-nino-luz" cx="130" cy="120" r="16" />
    <!-- Camino envolvente -->
    <path class="iso-camino-luz" d="M 75 190 C 100 195, 120 180, 142 160 C 168 138, 195 115, 195 90 C 195 55, 160 40, 125 45 C 88 50, 70 82, 75 120 C 80 158, 110 190, 152 195 C 185 198, 208 184, 218 170" />
  </g>

  <!-- Tipografía en Lana y Miel -->
  <g transform="translate(260, 0)">
    <text class="texto-nombre-luz" x="0" y="132">Trekan</text>
    <text class="texto-sub-luz" x="4" y="176">COLEGIO WALDORF</text>
  </g>
</svg>
