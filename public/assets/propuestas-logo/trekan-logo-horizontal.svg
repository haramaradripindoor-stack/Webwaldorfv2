<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="100%">
  <title>Colegio Waldorf Trekan - Logotipo Horizontal Oficial</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Figtree:wght@500;600&amp;display=swap');
      .iso-camino {
        fill: none;
        stroke: #2D2A4F;
        stroke-width: 14;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .iso-nino {
        fill: #D49A2A;
      }
      .texto-nombre {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 500;
        font-size: 88px;
        fill: #2D2A4F;
        letter-spacing: -1.5px;
      }
      .texto-sub {
        font-family: 'Figtree', system-ui, sans-serif;
        font-weight: 600;
        font-size: 19px;
        fill: #6F7F5B;
        letter-spacing: 9px;
      }
    </style>
  </defs>

  <!-- Grupo Isotipo (Escalado e integrado a la izquierda) -->
  <g transform="translate(40, 20) scale(0.75)">
    <!-- Niño centro -->
    <circle class="iso-nino" cx="130" cy="120" r="16" />
    <!-- Camino envolvente -->
    <path class="iso-camino" d="M 75 190 C 100 195, 120 180, 142 160 C 168 138, 195 115, 195 90 C 195 55, 160 40, 125 45 C 88 50, 70 82, 75 120 C 80 158, 110 190, 152 195 C 185 198, 208 184, 218 170" />
  </g>

  <!-- Separador sutil o alineación tipográfica -->
  <g transform="translate(260, 0)">
    <!-- Título Principal "Trekan" -->
    <text class="texto-nombre" x="0" y="132">Trekan</text>
    
    <!-- Subtítulo Institucional "COLEGIO WALDORF" -->
    <text class="texto-sub" x="4" y="176">COLEGIO WALDORF</text>
  </g>
</svg>
