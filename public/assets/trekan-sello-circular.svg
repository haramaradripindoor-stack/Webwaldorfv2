<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <title>Sello Circular Oficial - Colegio Waldorf Trekan (1 Tinta / Serigrafía y Bordado)</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Figtree:wght@600;700&amp;display=swap');
      .sello-borde {
        fill: none;
        stroke: #2D2A4F;
        stroke-width: 6;
      }
      .sello-borde-grueso {
        fill: none;
        stroke: #2D2A4F;
        stroke-width: 14;
      }
      .sello-texto {
        font-family: 'Figtree', system-ui, sans-serif;
        font-weight: 700;
        font-size: 24px;
        fill: #2D2A4F;
        letter-spacing: 5px;
      }
      .sello-centro-trazo {
        fill: none;
        stroke: #2D2A4F;
        stroke-width: 20;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sello-centro-punto {
        fill: #2D2A4F;
      }
    </style>

    <!-- Trayectorias de texto circulares -->
    <path id="arco-superior" d="M 90 300 A 210 210 0 0 1 510 300" fill="none" />
    <path id="arco-inferior" d="M 510 300 A 210 210 0 0 1 90 300" fill="none" />
  </defs>

  <!-- Anillos exteriores e interiores -->
  <circle class="sello-borde-grueso" cx="300" cy="300" r="280" />
  <circle class="sello-borde" cx="300" cy="300" r="260" />
  <circle class="sello-borde" cx="300" cy="300" r="160" />

  <!-- Texto Arriba: COLEGIO WALDORF TREKAN -->
  <text class="sello-texto">
    <textPath href="#arco-superior" startOffset="50%" text-anchor="middle">
      COLEGIO WALDORF TREKAN
    </textPath>
  </text>

  <!-- Texto Abajo: PUERTO VARAS • CHILE -->
  <text class="sello-texto">
    <textPath href="#arco-inferior" startOffset="50%" text-anchor="middle">
      • PUERTO VARAS • CHILE •
    </textPath>
  </text>

  <!-- Isotipo Central en 1 Sola Tinta -->
  <g transform="translate(180, 180) scale(0.6)">
    <circle class="sello-centro-punto" cx="200" cy="188" r="28" />
    <path class="sello-centro-trazo" d="M 90 315 C 135 320, 175 295, 215 260 C 260 220, 310 180, 310 135 C 310 70, 250 45, 185 55 C 115 65, 80 125, 90 195 C 100 260, 150 315, 230 325 C 290 330, 330 305, 350 280" />
  </g>
</svg>
