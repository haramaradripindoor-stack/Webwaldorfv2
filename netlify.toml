[build]
  publish = "."
  command = "node build.js"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Headers admin - permisivo para CMS
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:;"

# Cache assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
