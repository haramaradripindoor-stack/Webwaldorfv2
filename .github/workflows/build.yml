name: Build CMS
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: node build.js
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: CMS actualizado"
